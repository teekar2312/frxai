# docker-compose.prod.yml — Production Deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Create .env.production with all required secrets (see .env.example)
#   2. Set FINEX_DOMAIN to your public domain
#   3. Set CADDY_ADMIN_EMAIL for Let's Encrypt certificate notifications

services:
 app:
    image: finex-app:latest
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/custom.db
      - API_SECRET_KEY=${API_SECRET_KEY:?ERROR: API_SECRET_KEY is required}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?ERROR: NEXTAUTH_SECRET is required}
      - NEXTAUTH_URL=https://${FINEX_DOMAIN:-localhost}
      # Market Data
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - MARKETAUX_API_KEY=${MARKETAUX_API_KEY:-}
      # AI Providers
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - LOKAL_AI_BASE_URL=${LOKAL_AI_BASE_URL:-}
      - LOKAL_AI_API_KEY=${LOKAL_AI_API_KEY:-}
      # WebSocket Price Service
      - WS_PRICES_URL=http://ws-prices:3005
      # MT5 Bridge
      - MT5_BRIDGE_URL=${MT5_BRIDGE_URL:-http://finex-mt5-bridge:3002}
      - MT5_BRIDGE_SECRET=${MT5_BRIDGE_SECRET:-}
      # Email Notifications
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NOTIFICATION_EMAIL_FROM=${NOTIFICATION_EMAIL_FROM:-}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO:-}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - finex-data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - finex-net
    expose:
      - "3000"
    # No 'ports' — only accessible via Caddy reverse proxy

  caddy:
    image: caddy:2-alpine
    restart: always
    container_name: finex-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - FINEX_DOMAIN=${FINEX_DOMAIN:?ERROR: FINEX_DOMAIN is required}
      - CADDY_ADMIN_EMAIL=${CADDY_ADMIN_EMAIL:-admin@${FINEX_DOMAIN}}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - finex-net

  ws-prices:
    build:
      context: ./mini-services/ws-prices
      dockerfile: Dockerfile
    environment:
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3005/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    profiles: []
    networks:
      - finex-net

  mt5-bridge:
    build:
      context: ./mini-services/mt5-bridge
      dockerfile: Dockerfile
    container_name: finex-mt5-bridge
    restart: always
    environment:
      - MT5_BRIDGE_SECRET=${MT5_BRIDGE_SECRET:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    profiles:
      - mt5
    networks:
      - finex-net

volumes:
  finex-data:
  caddy-data:
  caddy-config:

networks:
  finex-net:
    driver: bridge
