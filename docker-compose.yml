version: "3.9"
services:
  app:
    build: .
    container_name: finex-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/custom.db
      - API_SECRET_KEY=${API_SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - MARKETAUX_API_KEY=${MARKETAUX_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - LOKAL_AI_BASE_URL=${LOKAL_AI_BASE_URL:-}
      - MT5_BRIDGE_URL=${MT5_BRIDGE_URL:-http://mt5-bridge:3002}
      - MT5_BRIDGE_SECRET=${MT5_BRIDGE_SECRET:-}
    volumes:
      - finex-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mt5-bridge:
    build:
      context: ./mini-services/mt5-bridge
      dockerfile: Dockerfile
    container_name: finex-mt5-bridge
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - MT5_BRIDGE_SECRET=${MT5_BRIDGE_SECRET:-}
    profiles:
      - mt5

volumes:
  finex-data: